[project]
name = "cwt-ads-agent"
version = "0.1.0"
description = "CrowdWisdomTrading Daily Ads AI Agent - CrewAI pipeline for ad research, analysis, scripting, and video creation"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.80.0",
    "crewai-tools>=0.20.0",
    "apify-client>=1.7.0",
    "elevenlabs>=1.50.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "litellm>=1.40.0",
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.0.0",
    "Pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cwt_ads_agent"]

[project.scripts]
cwt-ads = "cwt_ads_agent.main:run"
